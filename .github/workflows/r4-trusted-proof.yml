name: R4 trusted proof
run-name: apr-r4-e2p-${{ github.event_name == 'workflow_dispatch' && inputs.operation-id || github.event.workflow_run.pull_requests[0].head.ref }}
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: number
      operation-id:
        description: Authorized fixture operation id
        required: true
        type: string
permissions: {}
concurrency:
  group: agentic-pr-review-r4-${{ github.repository_id }}-pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr-number }}
  cancel-in-progress: false
jobs:
  authorization-preflight:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      pr-number: ${{ steps.authorization.outputs.pr-number }}
      fixture-head-sha: ${{ steps.authorization.outputs.fixture-head-sha }}
      operation-id: ${{ steps.authorization.outputs.operation-id }}
      authorization-manifest-digest: ${{ steps.authorization.outputs.authorization-manifest-digest }}
      request-budget-profile: ${{ steps.authorization.outputs.request-budget-profile }}
    steps:
      - id: authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          EVENT_PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          EVENT_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          INPUT_OPERATION_ID: ${{ inputs.operation-id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          R4_TRUSTED_PROOF_AUTHORIZATION: ${{ vars.R4_TRUSTED_PROOF_AUTHORIZATION }}
        run: |
          node <<'APR_R4_E2P_PREFLIGHT' >> "$GITHUB_OUTPUT"
          (async () => {
            const fail = (code) => {
              throw new Error(code);
            };
            const required = (name, pattern) => {
              const value = process.env[name] ?? '';
              if (!pattern.test(value)) fail(`environment-${name}`);
              return value;
            };
            const rejectDuplicateKeys = (text) => {
              const stack = [];
              for (let index = 0; index < text.length; index += 1) {
                const character = text[index];
                if (character === '"') {
                  const start = index;
                  for (index += 1; index < text.length; index += 1) {
                    if (text[index] === '\\') {
                      index += 1;
                    } else if (text[index] === '"') {
                      break;
                    }
                  }
                  if (index >= text.length) fail('github-response-json');
                  let following = index + 1;
                  while (/\s/u.test(text[following] ?? '')) following += 1;
                  const object = stack.at(-1);
                  if (text[following] === ':' && object?.kind === 'object') {
                    const key = JSON.parse(text.slice(start, index + 1));
                    if (object.keys.has(key)) fail('github-response-duplicate-key');
                    object.keys.add(key);
                  }
                } else if (character === '{') {
                  stack.push({ kind: 'object', keys: new Set() });
                } else if (character === '[') {
                  stack.push({ kind: 'array' });
                } else if (character === '}' || character === ']') {
                  stack.pop();
                }
              }
            };
            const lowerHex40 = /^[0-9a-f]{40}$/u;
            const lowerHex64 = /^[0-9a-f]{64}$/u;
            const positiveInteger = /^(?:[1-9][0-9]{0,18})$/u;
            const repository = required(
              'REPOSITORY',
              /^SolusQuest\/agentic-pr-review$/u,
            );
            const repositoryId = required('REPOSITORY_ID', positiveInteger);
            const workflowSha = required('WORKFLOW_SHA', lowerHex40);
            const authorizationText = required(
              'R4_TRUSTED_PROOF_AUTHORIZATION',
              /^[\x20-\x7e]{1,2048}$/u,
            );
            if (new TextEncoder().encode(authorizationText).length > 2048) {
              fail('authorization-size');
            }
            rejectDuplicateKeys(authorizationText);
            const authorization = JSON.parse(authorizationText);
            const manifestKeys = [
              'kind',
              'repository_id',
              'repository',
              'pr_number',
              'proof_scope',
              'fixture_head_sha',
              'operation_id',
              'workflow_sha',
              'action_source_sha',
              'payload_source_sha',
            ];
            if (
              authorization === null ||
              Array.isArray(authorization) ||
              typeof authorization !== 'object' ||
              JSON.stringify(Object.keys(authorization)) !== JSON.stringify(manifestKeys) ||
              authorization.kind !== 'apr-r4-e2p-authorization-manifest-v2' ||
              authorization.repository_id !== repositoryId ||
              authorization.repository !== repository ||
              !positiveInteger.test(String(authorization.pr_number ?? '')) ||
              !/^(?:normal|stale)$/u.test(authorization.proof_scope ?? '') ||
              !lowerHex40.test(authorization.fixture_head_sha ?? '') ||
              !lowerHex64.test(authorization.operation_id ?? '') ||
              !lowerHex40.test(authorization.workflow_sha ?? '') ||
              !lowerHex40.test(authorization.action_source_sha ?? '') ||
              !lowerHex40.test(authorization.payload_source_sha ?? '')
            ) {
              fail('authorization-manifest');
            }
            const actionSourceSha = authorization.action_source_sha;
            const payloadSourceSha = authorization.payload_source_sha;
            if (
              authorization.workflow_sha !== workflowSha ||
              actionSourceSha !== workflowSha ||
              payloadSourceSha !== workflowSha
            ) {
              fail('authorization-source-identity');
            }
            const eventName = required(
              'EVENT_NAME',
              /^(?:workflow_run|workflow_dispatch)$/u,
            );
            if (eventName === 'workflow_run') {
              const eventPullRequests = JSON.parse(
                required('EVENT_PULL_REQUESTS_JSON', /^\[[\s\S]{0,4096}\]$/u),
              );
              if (
                process.env.EVENT_ACTION !== 'completed' ||
                process.env.EVENT_CONCLUSION !== 'success' ||
                process.env.EVENT_WORKFLOW_ID !== '294554742' ||
                process.env.EVENT_WORKFLOW_NAME !== 'CI' ||
                process.env.EVENT_WORKFLOW_PATH !== '.github/workflows/ci.yml' ||
                process.env.EVENT_TRIGGER_EVENT !== 'pull_request' ||
                process.env.EVENT_REPOSITORY !== repository ||
                process.env.EVENT_REPOSITORY_ID !== repositoryId ||
                process.env.EVENT_HEAD_REPOSITORY !== repository ||
                process.env.EVENT_HEAD_REPOSITORY_ID !== repositoryId ||
                !Array.isArray(eventPullRequests) ||
                eventPullRequests.length !== 1 ||
                String(eventPullRequests[0]?.number) !==
                  process.env.EVENT_PR_NUMBER ||
                eventPullRequests[0]?.head?.sha !== process.env.EVENT_HEAD_SHA
              ) {
                fail('workflow-run-route-facts');
              }
            }
            const prNumber = required(
              eventName === 'workflow_run'
                ? 'EVENT_PR_NUMBER'
                : 'INPUT_PR_NUMBER',
              positiveInteger,
            );
            const requestBudgetProfile =
              eventName === 'workflow_run'
                ? authorization.proof_scope === 'normal'
                  ? 'final-bootstrap'
                  : 'final-stale'
                : authorization.proof_scope === 'normal'
                  ? 'final-continuation'
                  : fail('workflow-dispatch-proof-scope');
            const response = await fetch(
              `https://api.github.com/repos/${repository}/pulls/${prNumber}`,
              {
                method: 'GET',
                headers: {
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
              },
            );
            if (!response.ok) fail(`github-status-${response.status}`);
            const responseBytes = new Uint8Array(await response.arrayBuffer());
            if (responseBytes.length === 0 || responseBytes.length > 65536) {
              fail('github-response-size');
            }
            const responseText = new TextDecoder('utf-8', {
              fatal: true,
            }).decode(responseBytes);
            rejectDuplicateKeys(responseText);
            const pull = JSON.parse(responseText);
            if (
              pull === null ||
              Array.isArray(pull) ||
              typeof pull !== 'object' ||
              String(pull.number) !== prNumber ||
              pull.state !== 'open' ||
              pull.draft !== false ||
              pull.merged_at !== null ||
              pull.base?.repo?.full_name !== repository ||
              String(pull.base?.repo?.id) !== repositoryId ||
              pull.base?.ref !== 'main' ||
              !lowerHex40.test(pull.base?.sha ?? '') ||
              pull.head?.repo?.full_name !== repository ||
              String(pull.head?.repo?.id) !== repositoryId ||
              !lowerHex40.test(pull.head?.sha ?? '') ||
              !/^r4-trusted-proof\/[0-9a-f]{64}$/u.test(pull.head?.ref ?? '')
            ) {
              fail('pull-request-identity');
            }
            const fixtureHeadSha = pull.head.sha;
            if (
              eventName === 'workflow_run' &&
              (process.env.EVENT_HEAD_SHA !== fixtureHeadSha ||
                process.env.EVENT_PR_NUMBER !== prNumber)
            ) {
              fail('workflow-run-cross-check');
            }
            const operationId = pull.head.ref.slice('r4-trusted-proof/'.length);
            if (
              eventName === 'workflow_dispatch' &&
              required('INPUT_OPERATION_ID', lowerHex64) !== operationId
            ) {
              fail('workflow-dispatch-operation-id');
            }
            const manifest = JSON.stringify({
              kind: authorization.kind,
              repository_id: authorization.repository_id,
              repository: authorization.repository,
              pr_number: authorization.pr_number,
              proof_scope: authorization.proof_scope,
              fixture_head_sha: authorization.fixture_head_sha,
              operation_id: authorization.operation_id,
              workflow_sha: authorization.workflow_sha,
              action_source_sha: authorization.action_source_sha,
              payload_source_sha: authorization.payload_source_sha,
            });
            if (
              authorizationText !== manifest ||
              authorization.pr_number !== prNumber ||
              authorization.fixture_head_sha !== fixtureHeadSha ||
              authorization.operation_id !== operationId
            ) {
              fail('authorization-mismatch');
            }
            const digest = Array.from(
              new Uint8Array(
                await crypto.subtle.digest(
                  'SHA-256',
                  new TextEncoder().encode(manifest),
                ),
              ),
              (byte) => byte.toString(16).padStart(2, '0'),
            ).join('');
            if (!lowerHex64.test(digest)) fail('authorization-digest');
            process.stdout.write(
              `authorized=true\npr-number=${prNumber}\nfixture-head-sha=${fixtureHeadSha}\noperation-id=${operationId}\nauthorization-manifest-digest=${digest}\nrequest-budget-profile=${requestBudgetProfile}\n`,
            );
          })().catch((error) => {
            const code =
              error instanceof Error && /^[a-z0-9-]{1,96}$/u.test(error.message)
                ? error.message
                : 'preflight-failed';
            process.stderr.write(`APR_R4_E2P_PREFLIGHT_REJECTED ${code}\n`);
            process.stdout.write(
              'authorized=false\npr-number=\nfixture-head-sha=\noperation-id=\nauthorization-manifest-digest=\nrequest-budget-profile=\n',
            );
          });
          APR_R4_E2P_PREFLIGHT
  workflow-run-review:
    needs: authorization-preflight
    if: ${{ github.event_name == 'workflow_run' && needs.authorization-preflight.outputs.authorized == 'true' }}
    runs-on: ubuntu-24.04
    environment: r4-trusted-proof
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - id: acquire-exact-sources
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          CONTROL_ROOT_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY DEEPSEEK_API_KEY OPENAI_API_KEY AZURE_CLIENT_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GOOGLE_APPLICATION_CREDENTIALS
          acquire_exact_public_commit() {
            local destination="$1"
            local expected_sha="$2"
            if [ -e "$destination" ]; then
              echo "APR_R4_E2P_SOURCE_PATH_NOT_FRESH $destination" >&2
              exit 1
            fi
            git init --quiet "$destination"
            git -C "$destination" remote add origin https://github.com/SolusQuest/agentic-pr-review.git
            if git -C "$destination" config --local --get-regexp '^(credential\.helper|http\..*\.extraheader)$'; then
              echo "APR_R4_E2P_SOURCE_CREDENTIAL_CONFIGURATION" >&2
              exit 1
            fi
            git -C "$destination" fetch --depth=1 --no-tags origin "$expected_sha"
            if [ "$(git -C "$destination" rev-parse FETCH_HEAD)" != "$expected_sha" ]; then
              echo "APR_R4_E2P_SOURCE_FETCH_IDENTITY" >&2
              exit 1
            fi
            git -C "$destination" checkout --quiet --detach "$expected_sha"
            if [ "$(git -C "$destination" rev-parse HEAD)" != "$expected_sha" ]; then
              echo "APR_R4_E2P_SOURCE_CHECKOUT_IDENTITY" >&2
              exit 1
            fi
          }
          acquire_exact_public_commit "$GITHUB_WORKSPACE/control-root" "$CONTROL_ROOT_SHA"
          acquire_exact_public_commit "$GITHUB_WORKSPACE/payload-source" "$PAYLOAD_SOURCE_SHA"
      - id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-dotnet
        with:
          dotnet-version: 10.0.109
      - id: install-native-aot-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - id: prepare
        run: |
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY DEEPSEEK_API_KEY OPENAI_API_KEY AZURE_CLIENT_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GOOGLE_APPLICATION_CREDENTIALS
          bash control-root/runtime/scripts/prepare-r4-trusted-proof-payload-current.sh --source-root "$GITHUB_WORKSPACE/payload-source" --control-root "$GITHUB_WORKSPACE/control-root" --expected-source-sha "${{ github.workflow_sha }}" --output-root "$RUNNER_TEMP/r4-e2p-payload" --github-output "$GITHUB_OUTPUT"
      - id: barrier-hold
        env:
          AGENTIC_PR_REVIEW_R4_REQUEST_BUDGET_PROFILE: ${{ needs.authorization-preflight.outputs.request-budget-profile }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ needs.authorization-preflight.outputs.pr-number }}
          FIXTURE_HEAD_SHA: ${{ needs.authorization-preflight.outputs.fixture-head-sha }}
          OPERATION_ID: ${{ needs.authorization-preflight.outputs.operation-id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTION_SOURCE_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SOURCE_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SHA256: ${{ steps.prepare.outputs.prepared_payload_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          "${{ steps.prepare.outputs.prepared_root }}/${{ steps.prepare.outputs.prepared_executable }}" barrier hold
      - id: review
        uses: ./control-root/.github/actions/agentic-pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provider-api-key: ${{ secrets.AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY }}
          state-key: ${{ secrets.AGENTIC_PR_REVIEW_STATE_KEY }}
          previous-state-key: ${{ secrets.AGENTIC_PR_REVIEW_PREVIOUS_STATE_KEY || '' }}
          config-path: .github/agentic-pr-review/trusted-proof.json
          pr-number: ''
          state-mode: auto
        env:
          AGENTIC_PR_REVIEW_R4_REQUEST_BUDGET_PROFILE: ${{ needs.authorization-preflight.outputs.request-budget-profile }}
          AGENTIC_PR_REVIEW_PREPARED_ROOT: ${{ steps.prepare.outputs.prepared_root }}
          AGENTIC_PR_REVIEW_PREPARED_EXECUTABLE: ${{ steps.prepare.outputs.prepared_executable }}
          AGENTIC_PR_REVIEW_PREPARED_PAYLOAD_SHA256: ${{ steps.prepare.outputs.prepared_payload_sha256 }}
          AGENTIC_PR_REVIEW_ACTION_SOURCE_SHA: ${{ steps.prepare.outputs.action_source_sha }}
          AGENTIC_PR_REVIEW_PAYLOAD_BUILD_DISCRIMINATOR: ${{ steps.prepare.outputs.payload_build_discriminator }}
  workflow-dispatch-review:
    needs: authorization-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && needs.authorization-preflight.outputs.authorized == 'true' }}
    runs-on: ubuntu-24.04
    environment: r4-trusted-proof
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - id: acquire-exact-sources
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          CONTROL_ROOT_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY DEEPSEEK_API_KEY OPENAI_API_KEY AZURE_CLIENT_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GOOGLE_APPLICATION_CREDENTIALS
          acquire_exact_public_commit() {
            local destination="$1"
            local expected_sha="$2"
            if [ -e "$destination" ]; then
              echo "APR_R4_E2P_SOURCE_PATH_NOT_FRESH $destination" >&2
              exit 1
            fi
            git init --quiet "$destination"
            git -C "$destination" remote add origin https://github.com/SolusQuest/agentic-pr-review.git
            if git -C "$destination" config --local --get-regexp '^(credential\.helper|http\..*\.extraheader)$'; then
              echo "APR_R4_E2P_SOURCE_CREDENTIAL_CONFIGURATION" >&2
              exit 1
            fi
            git -C "$destination" fetch --depth=1 --no-tags origin "$expected_sha"
            if [ "$(git -C "$destination" rev-parse FETCH_HEAD)" != "$expected_sha" ]; then
              echo "APR_R4_E2P_SOURCE_FETCH_IDENTITY" >&2
              exit 1
            fi
            git -C "$destination" checkout --quiet --detach "$expected_sha"
            if [ "$(git -C "$destination" rev-parse HEAD)" != "$expected_sha" ]; then
              echo "APR_R4_E2P_SOURCE_CHECKOUT_IDENTITY" >&2
              exit 1
            fi
          }
          acquire_exact_public_commit "$GITHUB_WORKSPACE/control-root" "$CONTROL_ROOT_SHA"
          acquire_exact_public_commit "$GITHUB_WORKSPACE/payload-source" "$PAYLOAD_SOURCE_SHA"
      - id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-dotnet
        with:
          dotnet-version: 10.0.109
      - id: install-native-aot-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - id: prepare
        run: |
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY DEEPSEEK_API_KEY OPENAI_API_KEY AZURE_CLIENT_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GOOGLE_APPLICATION_CREDENTIALS
          bash control-root/runtime/scripts/prepare-r4-trusted-proof-payload-current.sh --source-root "$GITHUB_WORKSPACE/payload-source" --control-root "$GITHUB_WORKSPACE/control-root" --expected-source-sha "${{ github.workflow_sha }}" --output-root "$RUNNER_TEMP/r4-e2p-payload" --github-output "$GITHUB_OUTPUT"
      - id: barrier-verify-completed
        env:
          AGENTIC_PR_REVIEW_R4_REQUEST_BUDGET_PROFILE: ${{ needs.authorization-preflight.outputs.request-budget-profile }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ needs.authorization-preflight.outputs.pr-number }}
          FIXTURE_HEAD_SHA: ${{ needs.authorization-preflight.outputs.fixture-head-sha }}
          OPERATION_ID: ${{ needs.authorization-preflight.outputs.operation-id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTION_SOURCE_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SOURCE_SHA: ${{ github.workflow_sha }}
          PAYLOAD_SHA256: ${{ steps.prepare.outputs.prepared_payload_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          "${{ steps.prepare.outputs.prepared_root }}/${{ steps.prepare.outputs.prepared_executable }}" barrier verify-completed
      - id: review
        uses: ./control-root/.github/actions/agentic-pr-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provider-api-key: ${{ secrets.AGENTIC_PR_REVIEW_TRUSTED_PROOF_PROVIDER_CANARY }}
          state-key: ${{ secrets.AGENTIC_PR_REVIEW_STATE_KEY }}
          previous-state-key: ${{ secrets.AGENTIC_PR_REVIEW_PREVIOUS_STATE_KEY || '' }}
          config-path: .github/agentic-pr-review/trusted-proof.json
          pr-number: ${{ inputs.pr-number }}
          state-mode: auto
        env:
          AGENTIC_PR_REVIEW_R4_REQUEST_BUDGET_PROFILE: ${{ needs.authorization-preflight.outputs.request-budget-profile }}
          AGENTIC_PR_REVIEW_PREPARED_ROOT: ${{ steps.prepare.outputs.prepared_root }}
          AGENTIC_PR_REVIEW_PREPARED_EXECUTABLE: ${{ steps.prepare.outputs.prepared_executable }}
          AGENTIC_PR_REVIEW_PREPARED_PAYLOAD_SHA256: ${{ steps.prepare.outputs.prepared_payload_sha256 }}
          AGENTIC_PR_REVIEW_ACTION_SOURCE_SHA: ${{ steps.prepare.outputs.action_source_sha }}
          AGENTIC_PR_REVIEW_PAYLOAD_BUILD_DISCRIMINATOR: ${{ steps.prepare.outputs.payload_build_discriminator }}
