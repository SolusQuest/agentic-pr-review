name: SolusAgent APR managed package proof

on:
  workflow_dispatch:
    inputs:
      expected-head-sha:
        description: Exact reviewed source SHA for this authorized manual proof
        required: true
        type: string
      mode:
        description: Metadata collection is preparatory evidence, not qualification
        required: true
        default: collect
        type: choice
        options: [collect]

permissions:
  contents: read
  packages: read

jobs:
  install-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Bind the trusted manual source before package access
        env:
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          WORKFLOW_HEAD: ${{ github.workflow_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = SolusQuest/agentic-pr-review
          test "$(uname -m)" = x86_64
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$WORKFLOW_HEAD" = "$GITHUB_SHA"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          architecture: x64
      - name: Collect actual APR cold-restore metadata without qualification
        env:
          EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/release/solus-package-proof.mjs collect "$RUNNER_TEMP/apr-solus-facts"
      - name: Retain only sanitized identity and lock metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: solus-package-metadata
          path: ${{ runner.temp }}/apr-solus-facts/metadata.json
          if-no-files-found: error
          retention-days: 1
