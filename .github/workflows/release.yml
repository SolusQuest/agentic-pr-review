name: Candidate preparation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Separately authorized prepare or read-only finalize operation
        required: true
        type: choice
        default: prepare
        options: [prepare, finalize]
      finalize-request:
        description: Exact canonical candidate, builder, merged Action and storage request (finalize only)
        required: false
        type: string
      source-commit:
        description: Separately authorized exact payload source S (40 lowercase hex)
        required: true
        type: string
      release-version:
        description: Separately authorized canonical vMAJOR.MINOR.PATCH-internal.N
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-fixtures:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/release

  candidate-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install managed native-asset fixture compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-p1-dotnet
        with:
          dotnet-version: 10.0.109
      - name: Public FDD candidate contract smoke (not Solus qualification)
        run: node tests/release/verify-candidate.mjs

  prepare-build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SolusQuest/agentic-pr-review' && github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      archive-name: ${{ steps.build.outputs.archive_name }}
      archive-sha256: ${{ steps.build.outputs.archive_sha256 }}
      receipt-sha256: ${{ steps.build.outputs.receipt_sha256 }}
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.payload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Admit main workflow W and explicit source/version
        env:
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
        run: node control/scripts/release/prepare-candidate.mjs admit --source "$INPUT_SOURCE" --version "$INPUT_VERSION"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current preparation tooling
        working-directory: control
        run: |
          npm ci
          npm run check
          npm run dist:check
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-p1-dotnet
        with:
          dotnet-version: 10.0.109
      - name: Restore and verify exact managed dependencies with bounded package-read authority
        id: restore
        working-directory: control
        env:
          EXPECTED_HEAD: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/release/solus-package-proof.mjs verify "$RUNNER_TEMP/r7-p1-solus-cache"
      - name: Build and execute original package from clean S without publication credentials
        id: build
        env:
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
          NUGET_PACKAGES: ${{ runner.temp }}/r7-p1-solus-cache/packages
        run: node control/scripts/release/prepare-candidate.mjs build --source "$INPUT_SOURCE" --version "$INPUT_VERSION" --repo "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/r7-p1-package"
      - name: Retain original archive and producer receipt
        id: payload
        uses: actions/upload-artifact@v7
        with:
          name: r7-p1-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r7-p1-package/${{ steps.build.outputs.archive_name }}
            ${{ runner.temp }}/r7-p1-package/receipt.json
          archive: true
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7

  prepare-record:
    needs: prepare-build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SolusQuest/agentic-pr-review' && github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      candidate-sha256: ${{ steps.record.outputs.candidate_sha256 }}
      map-sha256: ${{ steps.record.outputs.map_sha256 }}
      metadata-id: ${{ steps.metadata.outputs.artifact-id }}
      metadata-sha256: ${{ steps.metadata.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/r7-p1-original
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Verify independent build hashes and exact payload storage before recording
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
          ARCHIVE_NAME: ${{ needs.prepare-build.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.prepare-build.outputs.archive-sha256 }}
          RECEIPT_SHA256: ${{ needs.prepare-build.outputs.receipt-sha256 }}
          ARTIFACT_ID: ${{ needs.prepare-build.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ needs.prepare-build.outputs.artifact-sha256 }}
        run: node control/scripts/release/prepare-candidate.mjs workflow-record --source "$INPUT_SOURCE" --version "$INPUT_VERSION" --archive "$RUNNER_TEMP/r7-p1-original/$ARCHIVE_NAME" --receipt "$RUNNER_TEMP/r7-p1-original/receipt.json" --archive-sha256 "$ARCHIVE_SHA256" --receipt-sha256 "$RECEIPT_SHA256" --artifact-id "$ARTIFACT_ID" --artifact-sha256 "$ARTIFACT_SHA256" --output "$RUNNER_TEMP/r7-p1-record"
      - name: Retain canonical candidate and proposed map
        id: metadata
        uses: actions/upload-artifact@v7
        with:
          name: r7-p1-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r7-p1-record/candidate.json
            ${{ runner.temp }}/r7-p1-record/proposed-action-map.json
            ${{ runner.temp }}/r7-p1-record/candidate.sha256
            ${{ runner.temp }}/r7-p1-record/proposed-action-map.sha256
            ${{ runner.temp }}/r7-p1-record/summary.txt
          archive: true
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
      - name: Record external locator without self-hash cycle
        env:
          CANDIDATE_SHA256: ${{ steps.record.outputs.candidate_sha256 }}
          METADATA_ID: ${{ steps.metadata.outputs.artifact-id }}
          METADATA_SHA256: ${{ steps.metadata.outputs.artifact-digest }}
        run: node control/scripts/release/prepare-candidate.mjs locator --candidate "$RUNNER_TEMP/r7-p1-record/candidate.json" --sha256 "$CANDIDATE_SHA256" --metadata-id "$METADATA_ID" --metadata-sha256 "$METADATA_SHA256"

  prepare-sign:
    needs: [prepare-build, prepare-record]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SolusQuest/agentic-pr-review' && github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      provenance-id: ${{ steps.evidence.outputs.artifact-id }}
      provenance-sha256: ${{ steps.evidence.outputs.artifact-digest }}
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/r7-p2-original
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare-record.outputs.metadata-id }}
          path: ${{ runner.temp }}/r7-p2-metadata
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Verify original candidate and storage before exposing signing inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCHIVE_NAME: ${{ needs.prepare-build.outputs.archive-name }}
          ARCHIVE_SHA256: ${{ needs.prepare-build.outputs.archive-sha256 }}
          RECEIPT_SHA256: ${{ needs.prepare-build.outputs.receipt-sha256 }}
          PAYLOAD_ID: ${{ needs.prepare-build.outputs.artifact-id }}
          PAYLOAD_SHA256: ${{ needs.prepare-build.outputs.artifact-sha256 }}
          CANDIDATE_SHA256: ${{ needs.prepare-record.outputs.candidate-sha256 }}
          MAP_SHA256: ${{ needs.prepare-record.outputs.map-sha256 }}
          METADATA_ID: ${{ needs.prepare-record.outputs.metadata-id }}
          METADATA_SHA256: ${{ needs.prepare-record.outputs.metadata-sha256 }}
        run: node control/scripts/release/verify-provenance.mjs workflow-predicate --archive "$RUNNER_TEMP/r7-p2-original/$ARCHIVE_NAME" --candidate "$RUNNER_TEMP/r7-p2-metadata/candidate.json" --map "$RUNNER_TEMP/r7-p2-metadata/proposed-action-map.json" --sha256 "$CANDIDATE_SHA256" --source "$INPUT_SOURCE" --workflow "$WORKFLOW_SHA" --version "$INPUT_VERSION" --metadata-id "$METADATA_ID" --metadata-sha256 "$METADATA_SHA256" --receipt "$RUNNER_TEMP/r7-p2-original/receipt.json" --output "$RUNNER_TEMP/r7-p2-evidence"
      - name: Install exact maintained provenance verifier
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz --output "$RUNNER_TEMP/r7-p2-gh.tar.gz"
          echo "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d  $RUNNER_TEMP/r7-p2-gh.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/r7-p2-gh"
          tar -xzf "$RUNNER_TEMP/r7-p2-gh.tar.gz" --strip-components=2 -C "$RUNNER_TEMP/r7-p2-gh" gh_2.103.3_linux_amd64/bin/gh
      - name: Attest original B and admitted detached source association
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.prepare-build.outputs.archive-name }}
          subject-digest: sha256:${{ needs.prepare-build.outputs.archive-sha256 }}
          predicate-type: https://github.com/SolusQuest/agentic-pr-review/attestations/candidate/v1
          predicate-path: ${{ runner.temp }}/r7-p2-evidence/predicate.json
          push-to-registry: false
          create-storage-record: false
      - name: Require restrictive cryptographic and candidate verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCHIVE_NAME: ${{ needs.prepare-build.outputs.archive-name }}
          CANDIDATE_SHA256: ${{ needs.prepare-record.outputs.candidate-sha256 }}
          METADATA_ID: ${{ needs.prepare-record.outputs.metadata-id }}
          METADATA_SHA256: ${{ needs.prepare-record.outputs.metadata-sha256 }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/r7-p2-evidence/bundle.json"
          PATH="$RUNNER_TEMP/r7-p2-gh:$PATH" node control/scripts/release/verify-provenance.mjs workflow-verify --archive "$RUNNER_TEMP/r7-p2-original/$ARCHIVE_NAME" --candidate "$RUNNER_TEMP/r7-p2-metadata/candidate.json" --map "$RUNNER_TEMP/r7-p2-metadata/proposed-action-map.json" --sha256 "$CANDIDATE_SHA256" --source "$INPUT_SOURCE" --workflow "$WORKFLOW_SHA" --version "$INPUT_VERSION" --metadata-id "$METADATA_ID" --metadata-sha256 "$METADATA_SHA256" --bundle "$RUNNER_TEMP/r7-p2-evidence/bundle.json" --output "$RUNNER_TEMP/r7-p2-evidence/verification.json"
      - name: Retain exact signing evidence only after successful verification
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: r7-p2-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r7-p2-evidence/predicate.json
            ${{ runner.temp }}/r7-p2-evidence/bundle.json
            ${{ runner.temp }}/r7-p2-evidence/verification.json
          archive: true
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
      - name: Record external provenance locator
        env:
          PROVENANCE_ID: ${{ steps.evidence.outputs.artifact-id }}
          PROVENANCE_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: node control/scripts/release/verify-provenance.mjs locator --artifact-id "$PROVENANCE_ID" --artifact-sha256 "$PROVENANCE_SHA256" --attestation-id "$ATTESTATION_ID"

  finalize:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SolusQuest/agentic-pr-review' && github.ref == 'refs/heads/main' && inputs.operation == 'finalize'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      pair-sha256: ${{ steps.finalize.outputs.pair_sha256 }}
      pair-json: ${{ steps.finalize.outputs.pair_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install locked read-only control tooling
        working-directory: control
        run: npm ci
      - name: Admit exact finalization inputs before artifact access
        id: request
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          FINALIZE_REQUEST: ${{ inputs.finalize-request }}
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
        run: node control/scripts/release/finalize-candidate.mjs admit-request --source "$INPUT_SOURCE" --version "$INPUT_VERSION" --output "$RUNNER_TEMP/r7-p3-request.json"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.payload_id }}
          path: ${{ runner.temp }}/r7-p3-original
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.metadata_id }}
          path: ${{ runner.temp }}/r7-p3-metadata
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.provenance_id }}
          path: ${{ runner.temp }}/r7-p3-provenance
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Install exact maintained provenance verifier
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz --output "$RUNNER_TEMP/r7-p3-gh.tar.gz"
          echo "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d  $RUNNER_TEMP/r7-p3-gh.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/r7-p3-gh"
          tar -xzf "$RUNNER_TEMP/r7-p3-gh.tar.gz" --strip-components=2 -C "$RUNNER_TEMP/r7-p3-gh" gh_2.103.3_linux_amd64/bin/gh
      - name: Finalize original pair read-only without issuing qualification
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          INPUT_SOURCE: ${{ inputs.source-commit }}
          INPUT_VERSION: ${{ inputs.release-version }}
          ARCHIVE_NAME: ${{ steps.request.outputs.archive_name }}
        run: PATH="$RUNNER_TEMP/r7-p3-gh:$PATH" node control/scripts/release/finalize-candidate.mjs workflow-finalize --repo "$GITHUB_WORKSPACE/control" --source "$INPUT_SOURCE" --version "$INPUT_VERSION" --request "$RUNNER_TEMP/r7-p3-request.json" --archive "$RUNNER_TEMP/r7-p3-original/$ARCHIVE_NAME" --candidate "$RUNNER_TEMP/r7-p3-metadata/candidate.json" --map "$RUNNER_TEMP/r7-p3-metadata/proposed-action-map.json" --bundle "$RUNNER_TEMP/r7-p3-provenance/bundle.json" --output "$RUNNER_TEMP/r7-p3-finalized"
