name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:check

  runtime-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the project-owned runtime
        run: >-
          dotnet build runtime/src/AgenticPrReview.Runtime/AgenticPrReview.Runtime.csproj
          --configuration Release --output "$RUNNER_TEMP/agentic-pr-review-runtime"

  retained-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise retained state, artifact, and residual conformance
        run: >-
          npm test -- --run
          src/artifact-provenance-vectors.test.ts
          src/residual-reference-guard.test.ts
          src/state-v2/core.test.ts
          src/state-v2/short-circuit-and-exhaustive.test.ts
