name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        run: npm run format:check
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        run: npm run typecheck
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        run: npm run dist:check
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 1
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 2
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 3
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 4
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 5
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  source-tests-6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/source-tests.mjs --shard 6
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  check:
    name: check
    if: ${{ always() }}
    needs:
      [
        format,
        typecheck,
        distribution,
        source-tests-1,
        source-tests-2,
        source-tests-3,
        source-tests-4,
        source-tests-5,
        source-tests-6,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all check dependencies to succeed
        env:
          SOURCE_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const ids = ['format', 'typecheck', 'distribution', 'source-tests-1', 'source-tests-2', 'source-tests-3', 'source-tests-4', 'source-tests-5', 'source-tests-6'];
          const results = JSON.parse(process.env.SOURCE_CI_NEEDS);
          if (!results || typeof results !== 'object' || Array.isArray(results) ||
              Object.keys(results).length !== ids.length ||
              ids.some((id) => results[id]?.result !== 'success')) {
            console.error('Required CI dependency did not succeed.');
            process.exit(1);
          }
          console.log('All required source CI checks succeeded.');
          NODE

  runtime-build-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        run: dotnet build runtime/src/AgenticPrReview.Runtime/AgenticPrReview.Runtime.csproj --configuration Release --output "$RUNNER_TEMP/agentic-pr-review-runtime"
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"

  retained-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify literal event-selected source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
      - name: Execute complete assigned check
        run: npm test -- --run src/artifact-provenance-vectors.test.ts src/residual-reference-guard.test.ts
      - name: Verify assigned check leaves source clean
        run: test -z "$(git status --porcelain)"
