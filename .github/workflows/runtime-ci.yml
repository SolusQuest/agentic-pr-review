name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Runtime tests
        run: bash runtime/scripts/verify-runtime.sh test

      - name: Framework-dependent bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh framework

      - name: Native AOT bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh aot

      - name: R2 Agent loop framework and Native AOT proof
        run: bash runtime/scripts/verify-agent-loop.sh all

      - name: R3 deterministic live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh deterministic

      - name: R3 Linux x64 Native AOT live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh aot

      - name: R4 framework ActionHost replacement proof first fresh process
        run: bash runtime/scripts/verify-action-host.sh framework

      - name: R4 framework ActionHost replacement proof second fresh process
        run: bash runtime/scripts/verify-action-host.sh framework

      - name: R4 Linux x64 Native AOT ActionHost proof first fresh process
        run: bash runtime/scripts/verify-action-host.sh aot | tee "$RUNNER_TEMP/r4-e2-aot-first.log"

      - name: R4 Linux x64 Native AOT ActionHost proof second fresh process
        run: bash runtime/scripts/verify-action-host.sh aot | tee "$RUNNER_TEMP/r4-e2-aot-second.log"

      - name: R4 Native AOT receipts are byte-identical
        run: |
          grep '^APR_R4_E2_RECEIPT ' "$RUNNER_TEMP/r4-e2-aot-first.log" > "$RUNNER_TEMP/r4-e2-aot-first.receipt"
          grep '^APR_R4_E2_RECEIPT ' "$RUNNER_TEMP/r4-e2-aot-second.log" > "$RUNNER_TEMP/r4-e2-aot-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2-aot-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2-aot-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2-aot-first.receipt" "$RUNNER_TEMP/r4-e2-aot-second.receipt"

      - name: R4 E2P trusted proof payload first clean Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh | tee "$RUNNER_TEMP/r4-e2p-first.log"

      - name: R4 E2P trusted proof payload second clean Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh | tee "$RUNNER_TEMP/r4-e2p-second.log"

      - name: R4 E2P supplemental receipts are byte-identical
        run: |
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-first.log" > "$RUNNER_TEMP/r4-e2p-first.receipt"
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-second.log" > "$RUNNER_TEMP/r4-e2p-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2p-first.receipt" "$RUNNER_TEMP/r4-e2p-second.receipt"

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - run: npm ci

      - name: Trusted-live policy and dry-run
        run: bash runtime/scripts/verify-live-agent.sh live --dry-run

      - name: Run host/runtime integration matrix
        run: npm run runtime:integration
