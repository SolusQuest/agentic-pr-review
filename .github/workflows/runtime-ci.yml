name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact merged main SHA authorized for the DeepSeek probe
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Runtime tests
        run: bash runtime/scripts/verify-runtime.sh test

      - name: Framework-dependent bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh framework

      - name: Native AOT bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh aot

      - name: R2 Agent loop framework and Native AOT proof
        run: bash runtime/scripts/verify-agent-loop.sh all

      - name: R3 deterministic live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh deterministic

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - run: npm ci

      - name: Run host/runtime integration matrix
        run: npm run runtime:integration

  deepseek-compatibility-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact authorized main head
        env:
          ACTUAL_HEAD_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HEAD_SHA}" == "${ACTUAL_HEAD_SHA}" ]]

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build compatibility probe without provider credentials
        run: bash runtime/scripts/probe-deepseek-request.sh build

      - name: Run bounded DeepSeek compatibility probe
        env:
          AGENTIC_REVIEW_DEEPSEEK_API_KEY: ${{ secrets.AGENTIC_REVIEW_DEEPSEEK_API_KEY }}
        run: bash runtime/scripts/probe-deepseek-request.sh run
