name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify-pair:
        description: Run a separately authorized exact original-pair qualification
        required: false
        type: boolean
        default: false
      qualifier-commit:
        description: Independently approved exact Q on main (40 lowercase hex)
        required: false
        type: string
      qualification-pair:
        description: Exact canonical P3 finalized-pair JSON (unqualified)
        required: false
        type: string
      qualification-pair-sha256:
        description: Independent SHA-256 of the original finalized-pair bytes
        required: false
        type: string
      qualification-request:
        description: Exact canonical P3 finalization request and three original artifact locators
        required: false
        type: string

permissions:
  contents: read

jobs:
  runtime-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: R4 historical and prospective fixture admission
        if: github.event_name == 'pull_request'
        run: npm run r4:trusted-proof:fixture-admission

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace

      - name: Set up exact R7-D1 package .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-d1-dotnet
        with:
          dotnet-version: 10.0.109

      - run: npm ci

      - name: Verify Runtime CI topology and failure semantics
        run: node scripts/verify-runtime-ci-workflow.mjs --self-test

      - name: Verify exact selected core source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SOURCE_SHA"

      # Actual private producer proof is mandatory in the trusted exact-head
      # package workflow. Ordinary PR/fork checks have no private package token.
      - name: CR1 managed format and package policy checks
        run: npm test -- tests/distribution/build-payload.test.ts --maxWorkers=2 --minWorkers=1

      - name: R7 exact-pair qualifier tooling fixtures (synthetic, no candidate operation)
        run: npm test -- tests/distribution/pair-qualification.test.ts tests/distribution/pair-qualification-workflow.test.ts --maxWorkers=2 --minWorkers=1

      - name: R7 credential-free isolated consumer network prerequisite (not archive qualification)
        run: node runtime/tests/ActionHostTrustedProofVerifier/ManagedArchive/verify-network.mjs

      - name: Runtime tests
        run: bash runtime/scripts/verify-runtime.sh test

      - name: Framework-dependent bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh framework

      - name: Verify core leaves the selected source clean
        run: test -z "$(git status --porcelain)"

  runtime-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace

      - name: Set up exact R7-D1 package .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-d1-dotnet
        with:
          dotnet-version: 10.0.109

      - run: npm ci

      - name: Verify exact selected lifecycle source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SOURCE_SHA"

      # Actual private producer proof is mandatory in the trusted exact-head
      # package workflow. Ordinary PR/fork checks have no private package token.
      - name: CR1 managed release and staging unit checks
        run: npm test -- tests/distribution/release-payload.test.ts --maxWorkers=2 --minWorkers=1

      - name: CR1 managed loader and lifecycle proof
        env:
          APR_CR1_MANAGED_LOADER_PROOF: '1'
        run: npm test -- tests/distribution/managed-host-process.test.ts --maxWorkers=2 --minWorkers=1

      - name: R3 deterministic live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh deterministic

      - name: Verify lifecycle leaves the selected source clean
        run: test -z "$(git status --porcelain)"

  r2-agent-loop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify exact selected R2 source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SOURCE_SHA"

      - name: Complete R2 Agent verification
        run: |
          bash runtime/scripts/verify-agent-loop.sh test
          bash runtime/scripts/verify-agent-loop.sh framework

      - name: Verify R2 leaves the selected source clean
        run: test -z "$(git status --porcelain)"

  r4-action-host:
    name: R4 ActionHost (${{ matrix.mode }}, ${{ matrix.repetition }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [framework]
        repetition: [first, second]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify exact selected R4 source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PROOF_MODE: ${{ matrix.mode }}
          PROOF_REPETITION: ${{ matrix.repetition }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s mode=%s repetition=%s\n' "$EXPECTED_SOURCE_SHA" "$PROOF_MODE" "$PROOF_REPETITION"

      - name: Run isolated ActionHost proof
        run: bash runtime/scripts/verify-action-host.sh "${{ matrix.mode }}"

  r5-proof:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected R5 source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify selected proof source is clean after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}

      - name: R5 deterministic evaluation gate in the retained framework supporting fixture
        run: bash runtime/scripts/verify-r5-evaluation.sh framework

      - name: Verify proof leaves source clean
        run: test -z "$(git status --porcelain)"

  r7-capacity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected R7 source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify selected proof source is clean after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}

      - name: R7 capacity gate in the retained framework and AOT supporting fixture
        run: bash runtime/scripts/verify-r7-capacity.sh all

      - name: Verify proof leaves source clean
        run: test -z "$(git status --porcelain)"

  r5-evaluation-gate:
    name: r5-evaluation-gate
    if: ${{ always() }}
    needs: [r5-proof, r7-capacity]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all r5-evaluation-gate dependencies to succeed
        env:
          R5_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const ids = ['r5-proof', 'r7-capacity'];
          const results = JSON.parse(process.env.R5_CI_NEEDS);
          if (!results || typeof results !== 'object' || Array.isArray(results) ||
              Object.keys(results).length !== ids.length ||
              ids.some((id) => results[id]?.result !== 'success')) {
            console.error('Required CI dependency did not succeed.');
            process.exit(1);
          }
          console.log('All required R5 and R7 proofs succeeded.');
          NODE

  r6-economics-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected R6 source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install managed native-asset and execution audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: R6 offline economics gate in the retained framework supporting fixture
        run: bash runtime/scripts/verify-r6-economics.sh framework

  trusted-proof-payload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5b5769753653bb3fd3e68cf8b7bb88a1bd350613
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-dotnet
        with:
          dotnet-version: 10.0.109

      - name: R4 E2P first clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-first.log"

      - name: R4 E2P second clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-second.log"

      - name: R4 E2P supplemental receipts are byte-identical
        run: |
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-first.log" > "$RUNNER_TEMP/r4-e2p-first.receipt"
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-second.log" > "$RUNNER_TEMP/r4-e2p-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2p-first.receipt" "$RUNNER_TEMP/r4-e2p-second.receipt"

  trusted-proof-payload-v2-first:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected payload source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Install current-head FDD and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace

      - name: Set up exact current-head R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-v2-dotnet
        with:
          dotnet-version: 10.0.109

      - name: Require clean event-selected V2 source after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Current-head D5 first independent managed V2 production/verifier proof
        env:
          APR_D5_REGRESSION_ROLE: first
        run: bash runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-first.log"

      - name: Extract bounded first receipt
        run: |
          grep '^APR_D5_V2_MANAGED_PROOF ' "$RUNNER_TEMP/r4-e2p-v2-first.log" > "$RUNNER_TEMP/r4-e2p-v2-first.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-first.receipt")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/r4-e2p-v2-first.receipt")" -le 32768

      - uses: actions/upload-artifact@v7
        with:
          name: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-first
          path: ${{ runner.temp }}/r4-e2p-v2-first.receipt
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
          archive: true

  trusted-proof-payload-v2-second:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected payload source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Install current-head FDD and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace

      - name: Set up exact current-head R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-v2-dotnet
        with:
          dotnet-version: 10.0.109

      - name: Require clean event-selected V2 source after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Current-head D5 second independent managed V2 production/verifier proof
        env:
          APR_D5_REGRESSION_ROLE: second
        run: bash runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-second.log"

      - name: Extract bounded second receipt
        run: |
          grep '^APR_D5_V2_MANAGED_PROOF ' "$RUNNER_TEMP/r4-e2p-v2-second.log" > "$RUNNER_TEMP/r4-e2p-v2-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-second.receipt")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/r4-e2p-v2-second.receipt")" -le 32768

      - uses: actions/upload-artifact@v7
        with:
          name: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-second
          path: ${{ runner.temp }}/r4-e2p-v2-second.receipt
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
          archive: true

  trusted-proof-payload-v2:
    if: ${{ always() }}
    needs: [trusted-proof-payload-v2-first, trusted-proof-payload-v2-second]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require both complete current-head V2 proofs to succeed
        env:
          V2_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const expected = ['trusted-proof-payload-v2-first', 'trusted-proof-payload-v2-second'].sort();
          let results;
          try {
            results = JSON.parse(process.env.V2_CI_NEEDS ?? '');
          } catch {
            console.error('V2 dependency results are invalid.');
            process.exit(1);
          }
          if (results === null || typeof results !== 'object' || Array.isArray(results) ||
              JSON.stringify(Object.keys(results).sort()) !== JSON.stringify(expected) ||
              expected.some(id => results[id]?.result !== 'success')) {
            console.error('Both complete current-head V2 proofs must succeed.');
            process.exit(1);
          }
          console.log('Both complete current-head V2 proofs succeeded.');
          NODE

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected aggregate source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - name: Prepare isolated receipt evidence directory
        run: |
          test ! -e "$RUNNER_TEMP/r4-e2p-v2-receipts"
          mkdir "$RUNNER_TEMP/r4-e2p-v2-receipts"

      - uses: actions/download-artifact@v8
        with:
          pattern: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/r4-e2p-v2-receipts
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error

      - name: Current-head R4 E2P receipts and source identities are exact
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/r4-e2p-v2-receipts" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { validateS5ManagedReceipt as validateManagedV2Receipt, recipeDigest, validateS5ManagedReceiptPair } from './scripts/check-r4-e2p-managed-receipt-v2.mjs';
          const [receiptRoot, runId, runAttempt, sourceCommit, sourceTree] =
            process.argv.slice(2);
          if (process.argv.length !== 7 || !/^[1-9][0-9]*$/.test(runId) ||
              !/^[1-9][0-9]*$/.test(runAttempt) ||
              !/^[a-f0-9]{40}$/.test(sourceCommit) || !/^[a-f0-9]{40}$/.test(sourceTree)) {
            throw new Error('The current-head receipt oracle is invalid.');
          }
          const roles = ['first', 'second'];
          const expected = roles.map(role => `r4-e2p-v2-${runId}-${runAttempt}-${role}`);
          if (!fs.lstatSync(receiptRoot).isDirectory() ||
              JSON.stringify(fs.readdirSync(receiptRoot).sort()) !== JSON.stringify(expected)) {
            throw new Error('Exactly first and second receipt artifacts are required.');
          }
          const prefix = 'APR_D5_V2_MANAGED_PROOF ';
          const currentReceipts = [];
          for (const [index, role] of roles.entries()) {
            const directory = path.join(receiptRoot, expected[index]);
            const file = `r4-e2p-v2-${role}.receipt`;
            if (!fs.lstatSync(directory).isDirectory() ||
                JSON.stringify(fs.readdirSync(directory)) !== JSON.stringify([file])) {
              throw new Error('Each artifact must contain only its expected receipt.');
            }
            const receiptPath = path.join(directory, file);
            const stat = fs.lstatSync(receiptPath);
            if (!stat.isFile() || stat.size === 0 || stat.size > 32768) {
              throw new Error('The current-head receipt file is not bounded regular evidence.');
            }
            const line = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true })
              .decode(fs.readFileSync(receiptPath));
            if (!line.startsWith(prefix) || line.indexOf('\n') !== line.length - 1) {
              throw new Error('The current-head receipt framing is invalid.');
            }
            const receipt = JSON.parse(line.slice(prefix.length));
            validateManagedV2Receipt(receipt);
            currentReceipts.push(receipt);
            if (receipt.role !== role || receipt.proof_recipe_sha256 !== recipeDigest(process.cwd())) {
              throw new Error('The managed V2 proof role or current recipe is invalid.');
            }
            if (receipt.source_commit !== sourceCommit ||
                receipt.source_tree !== sourceTree) {
              throw new Error('The current-head receipt source identity is invalid.');
            }
          }
          validateS5ManagedReceiptPair(currentReceipts);
          console.log('Both bounded current-head V2 receipts and source identities are exact.');
          NODE

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event-selected integration source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install managed proof native-asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - run: npm ci

      - name: Trusted-live policy and dry-run
        run: bash runtime/scripts/verify-live-agent.sh live --dry-run

      - name: Run host/runtime integration matrix
        run: npm run runtime:integration

  runtime:
    name: runtime
    if: ${{ always() }}
    needs: [runtime-core, runtime-lifecycle, r2-agent-loop, r4-action-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all former Runtime lanes to succeed
        env:
          RUNTIME_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const expected = ['runtime-core', 'runtime-lifecycle', 'r2-agent-loop', 'r4-action-host'].sort();
          let results;
          try {
            results = JSON.parse(process.env.RUNTIME_CI_NEEDS ?? '');
          } catch {
            console.error('Runtime CI dependency results are invalid.');
            process.exit(1);
          }
          if (results === null || typeof results !== 'object' || Array.isArray(results) ||
              JSON.stringify(Object.keys(results).sort()) !== JSON.stringify(expected) ||
              expected.some(id => results[id]?.result !== 'success')) {
            console.error('Every required Runtime CI lane must succeed.');
            process.exit(1);
          }
          console.log('All required Runtime CI lanes succeeded.');
          NODE

  qualify-original-pair:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'SolusQuest/agentic-pr-review' && github.ref == 'refs/heads/main' && inputs.qualify-pair
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install locked qualifier tooling
        working-directory: control
        run: npm ci
      - name: Admit exact main/manual Q and pair before artifact access
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFIER_COMMIT: ${{ inputs.qualifier-commit }}
          QUALIFICATION_PAIR: ${{ inputs.qualification-pair }}
          QUALIFICATION_PAIR_SHA256: ${{ inputs.qualification-pair-sha256 }}
          QUALIFICATION_REQUEST: ${{ inputs.qualification-request }}
        run: node control/scripts/release/qualify-pair.mjs admit --output "$RUNNER_TEMP/r7-v2-inputs"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.payload_id }}
          run-id: ${{ steps.request.outputs.producer_run_id }}
          path: ${{ runner.temp }}/r7-v2-artifacts/payload
          merge-multiple: true
          github-token: ${{ github.token }}
          skip-decompress: false
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.metadata_id }}
          run-id: ${{ steps.request.outputs.producer_run_id }}
          path: ${{ runner.temp }}/r7-v2-artifacts/metadata
          merge-multiple: true
          github-token: ${{ github.token }}
          skip-decompress: false
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.request.outputs.provenance_id }}
          run-id: ${{ steps.request.outputs.producer_run_id }}
          path: ${{ runner.temp }}/r7-v2-artifacts/provenance
          merge-multiple: true
          github-token: ${{ github.token }}
          skip-decompress: false
          digest-mismatch: error
      - name: Install exact maintained provenance verifier
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz --output "$RUNNER_TEMP/r7-v2-gh.tar.gz"
          echo "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d  $RUNNER_TEMP/r7-v2-gh.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/r7-v2-gh"
          tar -xzf "$RUNNER_TEMP/r7-v2-gh.tar.gz" --strip-components=2 -C "$RUNNER_TEMP/r7-v2-gh" gh_2.103.3_linux_amd64/bin/gh
      # SDK is used only for public supporting input/probe utilities. The
      # original B is never built; SDKs/caches are hidden from the consumer.
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-v2-dotnet
        with:
          dotnet-version: 10.0.109
      - name: Install isolated-consumer observation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc strace
      - name: Execute unchanged original B and exact composite T in isolated consumer
        id: qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFIER_COMMIT: ${{ inputs.qualifier-commit }}
          QUALIFICATION_PAIR_SHA256: ${{ inputs.qualification-pair-sha256 }}
        run: PATH="$RUNNER_TEMP/r7-v2-gh:$PATH" node control/scripts/release/qualify-pair.mjs run --inputs "$RUNNER_TEMP/r7-v2-inputs" --artifacts "$RUNNER_TEMP/r7-v2-artifacts" --output "$RUNNER_TEMP/r7-v2-evidence"
      - name: Retain only validated bounded qualification evidence
        if: ${{ always() && steps.qualify.outputs.evidence_ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: r7-v2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r7-v2-evidence/
          archive: true
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
