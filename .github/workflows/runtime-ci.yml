name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: R4 historical and prospective fixture admission
        if: github.event_name == 'pull_request'
        run: npm run r4:trusted-proof:fixture-admission

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Set up exact R7-D1 package .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r7-d1-dotnet
        with:
          dotnet-version: 10.0.109

      - run: npm ci

      - name: Verify Runtime CI topology and failure semantics
        run: node scripts/verify-runtime-ci-workflow.mjs --self-test

      - name: Verify exact selected core source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SOURCE_SHA"

      - name: Runtime tests
        run: bash runtime/scripts/verify-runtime.sh test

      - name: Framework-dependent bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh framework

      - name: Native AOT bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh aot

      - name: R3 deterministic live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh deterministic

      - name: R3 Linux x64 Native AOT live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh aot

      - name: Verify core leaves the selected source clean
        run: test -z "$(git status --porcelain)"

  r2-agent-loop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify exact selected R2 source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s\n' "$EXPECTED_SOURCE_SHA"

      - name: Complete R2 Agent verification
        run: bash runtime/scripts/verify-agent-loop.sh all

      - name: Verify R2 leaves the selected source clean
        run: test -z "$(git status --porcelain)"

  r4-action-host:
    name: R4 ActionHost (${{ matrix.mode }}, ${{ matrix.repetition }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [framework, aot]
        repetition: [first, second]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Verify exact selected R4 source and clean worktree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PROOF_MODE: ${{ matrix.mode }}
          PROOF_REPETITION: ${{ matrix.repetition }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'source_commit=%s mode=%s repetition=%s\n' "$EXPECTED_SOURCE_SHA" "$PROOF_MODE" "$PROOF_REPETITION"

      - name: Run isolated ActionHost proof
        run: bash runtime/scripts/verify-action-host.sh "${{ matrix.mode }}"

  r5-evaluation-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected R5 source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Exact-head default checks
        run: npm run check

      - name: Exact-head distribution checks
        run: npm run dist:check

      - name: Verify the worktree is still the exact selected head
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: R5 deterministic evaluation gate in framework and Linux x64 Native AOT
        run: bash runtime/scripts/verify-r5-evaluation.sh all

      - name: R7 capacity gate in framework and Linux x64 Native AOT
        run: bash runtime/scripts/verify-r7-capacity.sh all

  r6-economics-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected R6 source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT and execution audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev strace

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: R6 offline economics gate in framework and Linux x64 Native AOT
        run: bash runtime/scripts/verify-r6-economics.sh all

  trusted-proof-payload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5b5769753653bb3fd3e68cf8b7bb88a1bd350613
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-dotnet
        with:
          dotnet-version: 10.0.109

      - name: R4 E2P first clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-first.log"

      - name: R4 E2P second clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-second.log"

      - name: R4 E2P supplemental receipts are byte-identical
        run: |
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-first.log" > "$RUNNER_TEMP/r4-e2p-first.receipt"
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-second.log" > "$RUNNER_TEMP/r4-e2p-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2p-first.receipt" "$RUNNER_TEMP/r4-e2p-second.receipt"

  trusted-proof-payload-v2-first:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected payload source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Install current-head E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact current-head R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-v2-dotnet
        with:
          dotnet-version: 10.0.109

      - name: Require clean event-selected V2 source after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Current-head R4 E2P first clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-first.log"

      - name: Extract bounded first receipt
        run: |
          grep '^APR_R4_E2P_RECEIPT_V2 ' "$RUNNER_TEMP/r4-e2p-v2-first.log" > "$RUNNER_TEMP/r4-e2p-v2-first.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-first.receipt")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/r4-e2p-v2-first.receipt")" -le 32768

      - uses: actions/upload-artifact@v7
        with:
          name: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-first
          path: ${{ runner.temp }}/r4-e2p-v2-first.receipt
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
          archive: true

  trusted-proof-payload-v2-second:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected payload source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Install current-head E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact current-head R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-v2-dotnet
        with:
          dotnet-version: 10.0.109

      - name: Require clean event-selected V2 source after setup
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Current-head R4 E2P second clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-second.log"

      - name: Extract bounded second receipt
        run: |
          grep '^APR_R4_E2P_RECEIPT_V2 ' "$RUNNER_TEMP/r4-e2p-v2-second.log" > "$RUNNER_TEMP/r4-e2p-v2-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-second.receipt")" -eq 1
          test "$(wc -c < "$RUNNER_TEMP/r4-e2p-v2-second.receipt")" -le 32768

      - uses: actions/upload-artifact@v7
        with:
          name: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-second
          path: ${{ runner.temp }}/r4-e2p-v2-second.receipt
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
          archive: true

  trusted-proof-payload-v2:
    if: ${{ always() }}
    needs: [trusted-proof-payload-v2-first, trusted-proof-payload-v2-second]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require both complete current-head V2 proofs to succeed
        env:
          V2_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const expected = ['trusted-proof-payload-v2-first', 'trusted-proof-payload-v2-second'].sort();
          let results;
          try {
            results = JSON.parse(process.env.V2_CI_NEEDS ?? '');
          } catch {
            console.error('V2 dependency results are invalid.');
            process.exit(1);
          }
          if (results === null || typeof results !== 'object' || Array.isArray(results) ||
              JSON.stringify(Object.keys(results).sort()) !== JSON.stringify(expected) ||
              expected.some(id => results[id]?.result !== 'success')) {
            console.error('Both complete current-head V2 proofs must succeed.');
            process.exit(1);
          }
          console.log('Both complete current-head V2 proofs succeeded.');
          NODE

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event-selected aggregate source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git show -s --format=%T HEAD)"

      - name: Prepare isolated receipt evidence directory
        run: |
          test ! -e "$RUNNER_TEMP/r4-e2p-v2-receipts"
          mkdir "$RUNNER_TEMP/r4-e2p-v2-receipts"

      - uses: actions/download-artifact@v8
        with:
          pattern: r4-e2p-v2-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/r4-e2p-v2-receipts
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error

      - name: Current-head R4 E2P receipts and source identities are exact
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/r4-e2p-v2-receipts" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const [receiptRoot, runId, runAttempt, sourceCommit, sourceTree] =
            process.argv.slice(2);
          if (process.argv.length !== 7 || !/^[1-9][0-9]*$/.test(runId) ||
              !/^[1-9][0-9]*$/.test(runAttempt) ||
              !/^[a-f0-9]{40}$/.test(sourceCommit) || !/^[a-f0-9]{40}$/.test(sourceTree)) {
            throw new Error('The current-head receipt oracle is invalid.');
          }
          const roles = ['first', 'second'];
          const expected = roles.map(role => `r4-e2p-v2-${runId}-${runAttempt}-${role}`);
          if (!fs.lstatSync(receiptRoot).isDirectory() ||
              JSON.stringify(fs.readdirSync(receiptRoot).sort()) !== JSON.stringify(expected)) {
            throw new Error('Exactly first and second receipt artifacts are required.');
          }
          const prefix = 'APR_R4_E2P_RECEIPT_V2 ';
          for (const [index, role] of roles.entries()) {
            const directory = path.join(receiptRoot, expected[index]);
            const file = `r4-e2p-v2-${role}.receipt`;
            if (!fs.lstatSync(directory).isDirectory() ||
                JSON.stringify(fs.readdirSync(directory)) !== JSON.stringify([file])) {
              throw new Error('Each artifact must contain only its expected receipt.');
            }
            const receiptPath = path.join(directory, file);
            const stat = fs.lstatSync(receiptPath);
            if (!stat.isFile() || stat.size === 0 || stat.size > 32768) {
              throw new Error('The current-head receipt file is not bounded regular evidence.');
            }
            const line = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true })
              .decode(fs.readFileSync(receiptPath));
            if (!line.startsWith(prefix) || line.indexOf('\n') !== line.length - 1) {
              throw new Error('The current-head receipt framing is invalid.');
            }
            const receipt = JSON.parse(line.slice(prefix.length));
            if (receipt.source_commit !== sourceCommit ||
                receipt.source_tree !== sourceTree ||
                receipt.compiled_payload_source_commit !== sourceCommit ||
                receipt.compiled_payload_source_tree !== sourceTree) {
              throw new Error('The current-head receipt source identity is invalid.');
            }
          }
          console.log('Both bounded current-head V2 receipts and source identities are exact.');
          NODE

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event-selected integration source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - run: npm ci

      - name: Trusted-live policy and dry-run
        run: bash runtime/scripts/verify-live-agent.sh live --dry-run

      - name: Run host/runtime integration matrix
        run: npm run runtime:integration

  runtime:
    name: runtime
    if: ${{ always() }}
    needs: [runtime-core, r2-agent-loop, r4-action-host]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all former Runtime lanes to succeed
        env:
          RUNTIME_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const expected = ['runtime-core', 'r2-agent-loop', 'r4-action-host'].sort();
          let results;
          try {
            results = JSON.parse(process.env.RUNTIME_CI_NEEDS ?? '');
          } catch {
            console.error('Runtime CI dependency results are invalid.');
            process.exit(1);
          }
          if (results === null || typeof results !== 'object' || Array.isArray(results) ||
              JSON.stringify(Object.keys(results).sort()) !== JSON.stringify(expected) ||
              expected.some(id => results[id]?.result !== 'success')) {
            console.error('Every required Runtime CI lane must succeed.');
            process.exit(1);
          }
          console.log('All required Runtime CI lanes succeeded.');
          NODE
