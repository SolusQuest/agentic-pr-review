name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: npm ci

      - name: Runtime tests
        run: bash runtime/scripts/verify-runtime.sh test

      - name: Framework-dependent bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh framework

      - name: Native AOT bootstrap smoke
        run: bash runtime/scripts/verify-runtime.sh aot

      - name: R2 Agent loop framework and Native AOT proof
        run: bash runtime/scripts/verify-agent-loop.sh all

      - name: R3 deterministic live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh deterministic

      - name: R3 Linux x64 Native AOT live-agent replacement proof
        run: bash runtime/scripts/verify-live-agent.sh aot

      - name: R4 framework ActionHost replacement proof first fresh process
        run: bash runtime/scripts/verify-action-host.sh framework

      - name: R4 framework ActionHost replacement proof second fresh process
        run: bash runtime/scripts/verify-action-host.sh framework

      - name: R4 Linux x64 Native AOT ActionHost proof first fresh process
        run: bash runtime/scripts/verify-action-host.sh aot | tee "$RUNNER_TEMP/r4-e2-aot-first.log"

      - name: R4 Linux x64 Native AOT ActionHost proof second fresh process
        run: bash runtime/scripts/verify-action-host.sh aot | tee "$RUNNER_TEMP/r4-e2-aot-second.log"

      - name: R4 Native AOT receipts are byte-identical
        run: |
          grep '^APR_R4_E2_RECEIPT ' "$RUNNER_TEMP/r4-e2-aot-first.log" > "$RUNNER_TEMP/r4-e2-aot-first.receipt"
          grep '^APR_R4_E2_RECEIPT ' "$RUNNER_TEMP/r4-e2-aot-second.log" > "$RUNNER_TEMP/r4-e2-aot-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2-aot-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2-aot-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2-aot-first.receipt" "$RUNNER_TEMP/r4-e2-aot-second.receipt"

  trusted-proof-payload:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5b5769753653bb3fd3e68cf8b7bb88a1bd350613
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-dotnet
        with:
          dotnet-version: 10.0.109

      - name: R4 E2P first clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-first.log"

      - name: R4 E2P second clean production and verifier Native AOT build
        run: bash runtime/scripts/verify-r4-trusted-proof-payload.sh > "$RUNNER_TEMP/r4-e2p-second.log"

      - name: R4 E2P supplemental receipts are byte-identical
        run: |
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-first.log" > "$RUNNER_TEMP/r4-e2p-first.receipt"
          grep '^APR_R4_E2P_RECEIPT ' "$RUNNER_TEMP/r4-e2p-second.log" > "$RUNNER_TEMP/r4-e2p-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2p-first.receipt" "$RUNNER_TEMP/r4-e2p-second.receipt"

  trusted-proof-payload-v2:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact merged descendant payload source
        uses: actions/checkout@v6
        with:
          ref: edc594c29a8a6b5fdacfab48643bf221277af200
          path: payload-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact merged descendant payload source
        run: |
          test "$(git -C payload-source rev-parse HEAD)" = "edc594c29a8a6b5fdacfab48643bf221277af200"
          test "$(git -C payload-source rev-parse 'HEAD^{tree}')" = "8bf475a02a4f7307cdce2bbc29dd2bc6c6cf9089"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install staged E2P Native AOT and network-audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang strace zlib1g-dev

      - name: Set up exact staged R4 E2P .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r4-e2p-v2-dotnet
        with:
          dotnet-version: 10.0.109

      - name: Staged R4 E2P first clean production and verifier Native AOT build
        run: bash payload-source/runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-first.log"

      - name: Staged R4 E2P second clean production and verifier Native AOT build
        run: bash payload-source/runtime/scripts/verify-r4-trusted-proof-payload-v2.sh > "$RUNNER_TEMP/r4-e2p-v2-second.log"

      - name: Staged R4 E2P receipts are byte-identical
        run: |
          grep '^APR_R4_E2P_RECEIPT_V2 ' "$RUNNER_TEMP/r4-e2p-v2-first.log" > "$RUNNER_TEMP/r4-e2p-v2-first.receipt"
          grep '^APR_R4_E2P_RECEIPT_V2 ' "$RUNNER_TEMP/r4-e2p-v2-second.log" > "$RUNNER_TEMP/r4-e2p-v2-second.receipt"
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-first.receipt")" -eq 1
          test "$(wc -l < "$RUNNER_TEMP/r4-e2p-v2-second.receipt")" -eq 1
          cmp "$RUNNER_TEMP/r4-e2p-v2-first.receipt" "$RUNNER_TEMP/r4-e2p-v2-second.receipt"
          sed 's/^/APR_R4_E2P_RECEIPT_V2 /' \
            runtime/tests/fixtures/action-host/trusted-proof/trusted-proof-payload-receipt-v2.json \
            > "$RUNNER_TEMP/r4-e2p-v2-checked.receipt"
          cmp "$RUNNER_TEMP/r4-e2p-v2-first.receipt" "$RUNNER_TEMP/r4-e2p-v2-checked.receipt"

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install AOT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - run: npm ci

      - name: Trusted-live policy and dry-run
        run: bash runtime/scripts/verify-live-agent.sh live --dry-run

      - name: Run host/runtime integration matrix
        run: npm run runtime:integration
