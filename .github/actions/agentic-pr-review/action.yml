name: Agentic PR Review
description: Run the exact Native AOT review payload authorized by this Action's release map.
inputs:
  github-token:
    description: GitHub token supplied only to supported trusted routes.
    required: false
  provider-api-key:
    description: Private provider credential or trusted-proof canary supplied only to the selected provider boundary.
    required: false
  state-key:
    description: Current downstream-owned state encryption key for supported trusted routes.
    required: false
  previous-state-key:
    description: Optional previous state encryption key used only during an authorized rotation window.
    required: false
  config-path:
    description: Trusted-source path to the repository review configuration.
    required: false
    default: .github/agentic-pr-review.json
  pr-number:
    description: Pull request number required only for an authorized workflow_dispatch route.
    required: false
  state-mode:
    description: State selection mode; reset is accepted only for an authorized workflow_dispatch route.
    required: false
    default: auto
outputs:
  status:
    description: Validated Host status or fixed wrapper failed status.
  termination-reason:
    description: Closed review termination reason.
  model-calls:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  provider-attempts:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  provider-retries:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  provider-failed-attempts:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  provider-unknown-usage-attempts:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  provider-unknown-cache-partition-attempts:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  attempt-accounting-completeness:
    description: Independent accounting completeness.
  usage-completeness:
    description: Independent accounting completeness.
  input-tokens:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  input-cache-hit-tokens:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  input-cache-miss-tokens:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
  output-tokens:
    description: Known nonnegative decimal count string; omitted when unavailable or overflowed.
runs:
  using: node24
  main: dist/index.js
